[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-compute-node"
version = "0.1.0"
description = "Decentralized worker daemon for Distributed Matrix Multiplication network"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Distributed Matrix Multiply Team" }
]
keywords = ["distributed-computing", "matrix-multiplication", "l402", "nostr", "grpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "matrix-contracts",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "grpcio>=1.50.0",
    "protobuf>=4.21.0",
    "numpy>=1.22.0",
    "cryptography>=39.0.0",
    "websockets>=11.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "pynvml>=11.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "grpcio-tools>=1.50.0",
]

[project.scripts]
matrix-compute-node = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = [
    ".",
    "../matrix-contracts",
]
